<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | Painel de Gestão</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDKs -->
    <script type="module" src="js/firebase-config.js" defer></script>
    <script type="module" src="js/agenda.js" defer></script>
    <style>
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: rgba(0, 0, 0, 0.2); color: var(--text-secondary); font-weight: 500; }
        tr:hover { background: rgba(255, 255, 255, 0.05); }
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg); backdrop-filter: blur(12px);
            padding: 2rem; border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .action-btns button { padding: 0.4rem 0.8rem; font-size: 0.85rem; margin-right: 0.5rem; }
        .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
        .badge-1 { background: rgba(239, 68, 68, 0.2); color: #ef4444; } /* Alta */
        .badge-2 { background: rgba(245, 158, 11, 0.2); color: #f59e0b; } /* Media */
        .badge-3 { background: rgba(59, 130, 246, 0.2); color: #3b82f6; } /* Baixa */
    </style>
</head>
<body>
    <div class="dashboard-layout hidden" id="dashboardContent">
        <aside class="sidebar glass-card">
            <h2 class="mb-4 text-center">SIGEST</h2>
            <nav class="menu">
                <a href="dashboard.html" class="menu-item">Dashboard</a>
                <a href="membros.html" class="menu-item">Membros</a>
                <a href="financeiro.html" class="menu-item">Financeiro</a>
                <a href="celulas.html" class="menu-item">Células</a>
                <a href="agenda.html" class="menu-item active">Agenda</a>
                <a href="patrimonio.html" class="menu-item">Patrimônio</a>
                <a href="eventos.html" class="menu-item">Eventos</a>
                <a href="igrejas.html" class="menu-item">Congregações</a>
                <a href="funcionarios.html" class="menu-item">Funcionários</a>
                <a href="estudos.html" class="menu-item">Estudos Bíblicos</a>
                <a href="cartas.html" class="menu-item">Cartas</a>
                <a href="contatos.html" class="menu-item">Contatos</a>
                <a href="tarefas.html" class="menu-item">Tarefas</a>
                <a href="usuarios.html" class="menu-item">Usuários</a>
                <a href="configuracoes.html" class="menu-item" style="margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">Config. Genéricas</a>
                <a href="migracao.html" class="menu-item">Migração (SQL)</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="glass-card header mb-4">
                <h2>Agenda Pastoral e Tarefas</h2>
                <button id="addBtn" class="btn btn-primary" style="width: auto;">+ Novo Compromisso</button>
            </div>

            <div class="glass-card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data/Hora</th>
                                <th>Assunto</th>
                                <th>Prioridade</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="4" class="text-center">Carregando dados...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Adicionar/Editar -->
    <div id="modalForm" class="modal hidden">
        <div class="modal-content">
            <h3 class="mb-4" id="modalTitle">Cadastrar Compromisso</h3>
            <form id="dataForm">
                <input type="hidden" id="docId">
                <div class="form-grid mb-4">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Assunto *</label>
                        <input type="text" id="assunto" required>
                    </div>
                    <div class="form-group">
                        <label>Data *</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-group">
                        <label>Horário</label>
                        <input type="time" id="horario">
                    </div>
                    <div class="form-group">
                        <label>Prioridade</label>
                        <select id="prioridade" style="width: 100%; padding: 0.75rem; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px;">
                            <option value="3">Baixa</option>
                            <option value="2">Média</option>
                            <option value="1">Alta</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Detalhes/Tarefa</label>
                        <textarea id="tarefa" rows="3" style="width: 100%; padding: 0.75rem; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px;"></textarea>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-outline" style="width: auto;" id="closeBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="width: auto;" id="saveBtn">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
