<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários e Acessos | Painel de Gestão</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/firebase-config.js" defer></script>
    <script type="module" src="js/usuarios.js" defer></script>
    <style>
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: rgba(0, 0, 0, 0.2); color: var(--text-secondary); font-weight: 500; }
        tr:hover { background: rgba(255, 255, 255, 0.05); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); backdrop-filter: blur(12px); padding: 2rem; border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 1rem; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/global.js" defer></script>
</head>
<body>
    
    <!-- Mobile Header -->
    <div class="mobile-header hidden" id="mobileHeader">
        <h2 class="mobile-title">SIGEST</h2>
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>
    </div>
    
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="dashboard-layout hidden" id="dashboardContent">

        <aside class="sidebar glass-card">
            <h2 class="mb-4 text-center">SIGEST</h2>
            <nav class="menu" id="navMenuPlaceholder">
                <a href="dashboard.html" class="menu-item">Dashboard</a>
                <a href="membros.html" class="menu-item">Membros</a>
                <a href="financeiro.html" class="menu-item">Financeiro</a>
                <a href="celulas.html" class="menu-item">Células</a>
                <a href="agenda.html" class="menu-item">Agenda</a>
                <a href="patrimonio.html" class="menu-item">Patrimônio</a>
                <a href="eventos.html" class="menu-item">Eventos</a>
                <a href="igrejas.html" class="menu-item">Congregações</a>
                <a href="funcionarios.html" class="menu-item">Funcionários</a>
                <a href="estudos.html" class="menu-item">Estudos Bíblicos</a>
                <a href="cartas.html" class="menu-item">Cartas</a>
                <a href="contatos.html" class="menu-item">Contatos</a>
                <a href="tarefas.html" class="menu-item">Tarefas</a>
                <a href="usuarios.html" class="menu-item active">Usuários</a>
                <a href="configuracoes.html" class="menu-item" style="margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">Config. Genéricas</a>
                <a href="migracao.html" class="menu-item">Migração (SQL)</a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="glass-card header mb-4">
                <h2>Usuários e Acessos</h2>
                <button id="addBtn" class="btn btn-primary" style="width: auto;">+ Novo</button>
            </div>
            <div class="glass-card">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Nome</th><th>Email</th><th>Ações</th></tr></thead>
                        <tbody id="tableBody"><tr><td colspan="3" class="text-center">Carregando dados...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <div id="modalForm" class="modal hidden">
        <div class="modal-content">
            <h3 class="mb-4">Cadastrar Usuários e Acessos</h3>
            <form id="dataForm">
                <div class="form-group"><label>Campo 1 *</label><input type="text" id="campo1" required></div>
                <div class="form-group"><label>Campo 2</label><input type="text" id="campo2"></div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem;">
                    <button type="button" class="btn btn-outline" style="width: auto;" id="closeBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="width: auto;" id="saveBtn">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
